version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: keycloak-26-agent
    environment:
      # Default admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Database (H2 for dev, embedded)
      # For production, use PostgreSQL or MySQL
      KC_DB: h2
      
      # Logging
      KC_LOG_LEVEL: INFO
      
      # Features
      KC_FEATURES: |
        account3:enabled
        admin_fine_grained_authz:enabled
        admin2:enabled
    
    ports:
      # Admin console and OAuth endpoints
      - "8080:8080"
    
    command: start-dev
    
    # Volumes for persisting data
    # Uncomment to persist Keycloak data between container restarts
    volumes:
      - keycloak_data:/opt/keycloak/data
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Restart policy
    restart: unless-stopped
    
    # Network
    networks:
      - a2a-network

  # Optional: PostgreSQL for production-ready setup
  # Uncomment this section if you want to use PostgreSQL instead of H2
  
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: keycloak-postgres
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: keycloak
  #     POSTGRES_PASSWORD: keycloak
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - a2a-network
  #   restart: unless-stopped

networks:
  a2a-network:
    driver: bridge

volumes:
  keycloak_data:
    driver: local
  # postgres_data:
  #   driver: local
